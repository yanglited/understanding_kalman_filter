version: "3"
services:
  code:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DISPLAY: $DISPLAY
    network_mode: "host"
    volumes:
      # X11
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $XAUTHORITY:/root/.Xauthority
      # share code files
      - ../:/app/:rw

